# TeleMem configuration using MiniMax M3.1 Flash as the LLM provider
#
# MiniMax provides an OpenAI-compatible API with regional endpoints:
#   - Global: https://api.minimax.io/v1
#   - China:  https://api.minimax.cn/v1
# Get your API key at: https://platform.minimax.io (or https://platform.minimaxi.com)
#
# Current text models (both accept text/image/video input):
#   - MiniMax-M3.1-Flash (default; 1,000,000 context; adaptive thinking only)
#   - MiniMax-M3         (1,000,000 context; adaptive or disabled thinking)
# Flash defaults to max reasoning effort when omitted. It does not accept
# disabled thinking, reasoning_effort=none, service_tier or reasoning_split=false.
# Explicit model IDs in existing/custom configs are passed through unchanged.
#
# Note: MiniMax does not offer a public embedding API.
# Configure a separate embedding service (e.g. OpenAI) for the embedder section.

llm:
  provider: openai
  config:
    model: MiniMax-M3.1-Flash  # alternative: MiniMax-M3
    openai_base_url: https://api.minimax.io/v1  # use https://api.minimax.cn/v1 for the China endpoint
    api_key: your-minimax-api-key  # replace with your key or ${MINIMAX_API_KEY}
    is_reasoning_model: true  # Forward configured effort; omit the adapter's small default token cap
    # reasoning_effort: max  # Flash: low, medium, high, xhigh or max (default); M3 ignores effort
    temperature: 0.7  # Ignored by MiniMax-M3.1-Flash and MiniMax-M3 (fixed at 1)

embedder:
  provider: openai
  config:
    model: text-embedding-3-small
    openai_base_url: https://api.openai.com/v1
    api_key: your-openai-api-key  # Required for embeddings (MiniMax has no embedding API)

vector_store:
  provider: faiss
  config:
    collection_name: telemem
    path: db/faiss_db

history_db_path: db/history.db

buffer_size: 64
similarity_threshold: 0.95
