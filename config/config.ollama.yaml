# TeleMem configuration using Ollama — fully local, no cloud, no API key.
#
# Ollama exposes an OpenAI-compatible API at http://localhost:11434/v1.
#
# Setup:
#   ollama pull qwen3:8b            # LLM (any chat model works)
#   ollama pull nomic-embed-text    # embeddings (768 dimensions)
#   ollama serve                    # if not already running
#
# Then:
#   TELEMEM_CONFIG=config/config.ollama.yaml python examples/quickstart.py

llm:
  provider: openai
  config:
    model: qwen3:8b  # any Ollama chat model, e.g. llama3.1:8b, mistral:7b
    openai_base_url: http://localhost:11434/v1
    api_key: ollama  # Ollama ignores the key, but the client requires one

embedder:
  provider: openai
  config:
    model: nomic-embed-text
    openai_base_url: http://localhost:11434/v1
    api_key: ollama
    embedding_dims: 768  # nomic-embed-text outputs 768-dim vectors

vector_store:
  provider: faiss
  config:
    collection_name: telemem
    path: db/faiss_db
    embedding_model_dims: 768  # must match the embedder dimensions

history_db_path: db/history.db

buffer_size: 64
similarity_threshold: 0.95
