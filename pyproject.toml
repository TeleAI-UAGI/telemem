[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemem"
dynamic = ["version"]
description = "Long-term & multimodal memory for AI agents — character isolation, video pipeline, MCP server, mem0-compatible"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "TeleAI-UAGI"}
]
keywords = [
    "memory", "agent-memory", "long-term-memory", "mem0", "mcp",
    "model-context-protocol", "langchain", "llm", "rag", "faiss",
    "multimodal", "video-memory", "character-memory", "local-llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mem0ai",
    "openai",
    "pydantic",
    "faiss-cpu",
    "numpy",
    "pyyaml",
    "tqdm",
    "mcp>=1.6.0",
]

[project.optional-dependencies]
# Kept as an alias for backward compatibility: the MCP SDK is now a core
# dependency so `uvx telemem` works without extras (MCP registry convention).
mcp = [
    "mcp>=1.6.0"
]
video = [
    "opencv-python-headless",
    "nano-vectordb",
    "yt_dlp",
    "azure-identity",
    "requests",
]
all = [
    "telemem[mcp,video]",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
telemem-mcp = "telemem.mcp.server:main"
# `telemem` == the MCP server on stdio, so `uvx telemem` works out of the box
# (the MCP registry convention is that the package identifier is runnable).
telemem = "telemem.mcp.server:main"

[project.urls]
Homepage = "https://github.com/TeleAI-UAGI/telemem"
Documentation = "https://teleai-uagi.github.io/telemem/"
Changelog = "https://github.com/TeleAI-UAGI/telemem/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/TeleAI-UAGI/telemem/issues"

[tool.hatch.version]
path = "telemem/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["telemem", "config", "examples", "tests", "requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["telemem"]