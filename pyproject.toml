[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemem"
dynamic = ["version"]
description = "High-performance drop-in replacement of Mem0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "TeleAI-UAGI"}
]
dependencies = [
    "openai",
    "pydantic",
    "chromadb",
    "opencv-python-headless",
    "nano-vectordb",
    "mem0ai",
    "tqdm",
    "azure-identity",
    "yt_dlp",
    "faiss-cpu"
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.6.0"
]

[project.scripts]
telemem-mcp = "telemem.mcp.server:main"

[project.urls]
Homepage = "https://github.com/TeleAI-UAGI/telemem"
Documentation = "https://github.com/TeleAI-UAGI/telemem#readme"

[tool.hatch.version]
path = "telemem/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["telemem", "config", "examples", "tests", "requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = ["telemem"]