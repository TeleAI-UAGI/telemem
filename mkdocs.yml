site_name: TeleMem
site_description: Long-term and multimodal memory for agentic AI — a high-performance, mem0-compatible memory layer.
site_url: https://teleai-uagi.github.io/telemem/
repo_url: https://github.com/TeleAI-UAGI/telemem
repo_name: TeleAI-UAGI/telemem
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/TeleMem.png
  favicon: assets/TeleMem.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.share
    - search.suggest

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TeleAI-UAGI/telemem
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/telemem/
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_ID, ""]

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - LLM Providers: providers.md
  - Video Memory: video.md
  - MCP Server: MCP.md
  - Evaluation Principles: evaluation.md
  - API Reference: api.md
  - Contributing: contributing.md
