name: Release

# Publishes to PyPI when a version tag (v1.5.0, v2.0.0, ...) is pushed.
#
# Uses PyPI "trusted publishing" (OIDC) — no API token stored in GitHub.
# One-time setup (requires owner/maintainer access to the `telemem` project
# on PyPI): https://pypi.org/manage/project/telemem/settings/publishing/
#   - Owner: TeleAI-UAGI   Repository: telemem
#   - Workflow name: release.yml   Environment: pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. v1.7.0 — must match telemem.__version__ on this ref"
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('telemem/__init__.py').read_text()).group(1))")
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Release version $RELEASE_TAG does not match telemem.__version__ ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  mcp-registry:
    # Publish to the official MCP registry (registry.modelcontextprotocol.io).
    # Auth: GitHub OIDC grants the io.github.teleai-uagi/* namespace; package
    # ownership is proven by the "mcp-name:" marker in the PyPI description.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64) ARCH=arm64 ;; esac
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - name: Sync server.json version to tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          jq --arg v "$TAG_VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Wait for PyPI to serve the new version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/telemem/$TAG_VERSION/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI version $TAG_VERSION not visible after 5 minutes" >&2
          exit 1

      - name: Publish to MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
